name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cityeyes_test
          POSTGRES_USER: cityeyes_test
          POSTGRES_PASSWORD: cityeyes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cityeyes_test -d cityeyes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Create isolated API test schema and seed
        run: |
          DATABASE_URL="$DATABASE_TEST_URL" pnpm --filter @workspace/db run push
          DATABASE_URL="$DATABASE_TEST_URL" pnpm --filter @workspace/db run seed
        env:
          DATABASE_TEST_URL: postgresql://cityeyes_test:cityeyes_test@localhost:5432/cityeyes_test
      - name: Test API using isolated database
        run: pnpm --filter @workspace/api-server test
        env:
          DATABASE_TEST_URL: postgresql://cityeyes_test:cityeyes_test@localhost:5432/cityeyes_test
          PRIVATE_OBJECT_DIR: /tmp/city-eyes-test-storage
      - name: Test mobile protected state
        run: pnpm --filter @workspace/city-eyes-mobile test
      - run: pnpm --filter @workspace/mockup-sandbox test
